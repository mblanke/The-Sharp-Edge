services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sharpedge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sharpedge}
      POSTGRES_DB: ${POSTGRES_DB:-sharpedge}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sharpedge} -d ${POSTGRES_DB:-sharpedge}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5442:5432"

  api:
    build: ./api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sharpedge}:${POSTGRES_PASSWORD:-sharpedge}@db:5432/${POSTGRES_DB:-sharpedge}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./seed:/seed:ro
      # Read-only view of the cookbook shelf so /library can list what Atlas has
      # ingested. Optional — LIBRARY_DIR empty just yields an empty book list.
      - ${LIBRARY_HOST_DIR:-/mnt/media/References/Cooking}:/mnt/references/Cooking:ro
    ports:
      - "8010:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      # rag-api (:8099) and llm-router (:4000) live in the Atlas ai-stack. Reaching
      # them via the host's Tailscale IP times out from inside a container — the
      # bridge has no route back to tailscale0 — so join their network and address
      # them by container name, as CLAUDE.md §9 anticipates.
      - ai-stack
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  web:
    build: ./web
    environment:
      API_URL: http://api:8000
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
      API_TOKEN: ${API_TOKEN}
    depends_on:
      - api
    ports:
      - "3010:3000"

networks:
  default:
  # Created by the Atlas ai-stack; not managed here.
  ai-stack:
    external: true
    name: ${AI_STACK_NETWORK:-ai-stack_ai}

volumes:
  pgdata:
