name: Parity

# Holds the three implementations of the kitchen arithmetic to the same answers.
# See shared/fixtures/README.md — the expectations are generated from the Python, so a
# change to a service that the Swift port hasn't followed shows up here as a red build
# naming the exact input that moved.
#
# Until this existed, nothing in CI ran either test suite: testflight.yml only builds
# and uploads the app.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "shared/fixtures/**"
      - "api/**"
      - "web/**"
      - "ios/**"
      - ".github/workflows/parity.yml"
  pull_request:
    paths:
      - "shared/fixtures/**"
      - "api/**"
      - "web/**"
      - "ios/**"

concurrency:
  group: parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        working-directory: api
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Fails if a service changed and the committed fixtures were not regenerated.
      - name: Fixtures are current
        run: python api/scripts/dump_fixtures.py --check

      - name: Tests
        working-directory: api
        run: pytest -q

  web:
    name: Web (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm test

  ios:
    name: iOS (xcodebuild test)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      # The fixture loader resolves shared/fixtures from the source tree via #filePath,
      # so this must run on a simulator, not a device.
      - name: Tests
        working-directory: ios
        run: |
          set -euo pipefail
          # Any available iPad; the runner image's exact lineup changes over time and
          # pinning one model is a build that breaks for no reason.
          # Strip the UDID and state but keep the model suffix — the device is named
          # "iPad Pro 11-inch (M4)", and "iPad Pro 11-inch" matches nothing.
          SIM=$(xcrun simctl list devices available \
                | sed -n 's/^ *\(iPad .*\) ([0-9A-F-]\{36\}).*/\1/p' | head -1)
          test -n "$SIM" || { echo "No iPad simulator available"; exit 1; }
          echo "Simulator: $SIM"
          xcodebuild test \
            -project TheSharpEdge.xcodeproj \
            -scheme TheSharpEdge \
            -destination "platform=iOS Simulator,name=$SIM" \
            CODE_SIGNING_ALLOWED=NO
