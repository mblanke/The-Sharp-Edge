<style>
:root{
  --paper:#F2F1EC; --ink:#20241E; --faint:#6B6F63;
  --green:#3E6B4A; --green-deep:#2C4F36; --copper:#C87A2E;
  --line:#D9D7CC; --card:#FAFAF6;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:'Work Sans',system-ui,sans-serif;font-size:16px;line-height:1.55}
.wrap{max-width:680px;margin:0 auto;padding:0 18px 80px}

header{padding:34px 0 10px;border-bottom:2px solid var(--ink)}
.eyebrow{font-family:'Spline Sans Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--green)}
h1{font-family:'Fraunces',serif;font-weight:650;font-size:clamp(30px,7vw,42px);line-height:1.05;margin:6px 0 8px}
.sub{color:var(--faint);font-size:14px;max-width:44ch}

nav.toc{padding:18px 0 6px}
.toc-cat{margin-bottom:14px}
.toc-cat h2{font-family:'Spline Sans Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.toc-cat a{display:inline-block;font-size:14px;font-weight:500;color:var(--ink);text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 13px;margin:0 6px 7px 0;transition:border-color .15s}
.toc-cat a:hover,.toc-cat a:focus-visible{border-color:var(--green);color:var(--green-deep)}
a:focus-visible,button:focus-visible{outline:2px solid var(--copper);outline-offset:2px}

article.recipe{margin-top:44px;padding-top:26px;border-top:1px solid var(--line);scroll-margin-top:14px}
.r-cat{font-family:'Spline Sans Mono',monospace;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--copper)}
.recipe h2.r-title{font-family:'Fraunces',serif;font-weight:650;font-size:clamp(24px,5.6vw,32px);line-height:1.1;margin:4px 0 6px}
.r-meta{color:var(--faint);font-size:13.5px;margin-bottom:14px}
.r-prov{font-size:12.5px;color:var(--faint);font-style:italic;margin:-8px 0 14px}

.scaler{display:flex;align-items:center;gap:12px;background:var(--green-deep);color:#F4F3EC;border-radius:14px;padding:12px 14px;margin-bottom:18px}
.scaler .lab{font-family:'Spline Sans Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.scaler .val{font-family:'Fraunces',serif;font-size:26px;font-weight:650;min-width:2.2ch;text-align:center}
.scaler button{width:44px;height:44px;border-radius:10px;border:none;background:rgba(255,255,255,.14);color:#fff;font-size:22px;font-weight:600;cursor:pointer;transition:background .15s}
.scaler button:hover{background:rgba(255,255,255,.26)}
.scaler .reset{margin-left:auto;width:auto;height:auto;padding:7px 12px;font-family:'Spline Sans Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:transparent;border:1px solid rgba(255,255,255,.35);border-radius:8px}
.scaler .reset:hover{background:rgba(255,255,255,.12)}
.scaler .unitword{font-size:13px;opacity:.8}

h3.sect{font-family:'Spline Sans Mono',monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--green);margin:18px 0 8px}
ul.ing{list-style:none}
ul.ing li{display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:15px;align-items:baseline}
.qty{font-family:'Spline Sans Mono',monospace;font-size:14px;font-weight:500;color:var(--green-deep);min-width:86px;flex-shrink:0;transition:color .15s}
.qty.flash{color:var(--copper)}
ol.steps{list-style:none;counter-reset:st}
ol.steps li{counter-increment:st;position:relative;padding:7px 0 7px 40px;font-size:15px}
ol.steps li::before{content:counter(st);position:absolute;left:0;top:8px;width:26px;height:26px;border:1.5px solid var(--green);border-radius:50%;color:var(--green-deep);font-family:'Spline Sans Mono',monospace;font-size:12.5px;font-weight:500;display:flex;align-items:center;justify-content:center}
ul.notes{list-style:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:6px}
ul.notes li{font-size:13.5px;color:var(--faint);padding:3px 0}
ul.notes li::before{content:"— "}

.askrow{margin-top:16px}
.ask{display:inline-block;text-decoration:none;font-weight:600;font-size:14px;color:var(--green-deep);border:1.5px solid var(--green);border-radius:10px;padding:10px 16px;transition:background .15s,color .15s}
.ask:hover{background:var(--green);color:#F4F3EC}

.gf-tag{display:inline-block;font-family:'Spline Sans Mono',monospace;font-size:10.5px;letter-spacing:.08em;color:var(--green-deep);border:1px solid var(--green);border-radius:5px;padding:2px 7px;vertical-align:2px;margin-left:8px}

footer{margin-top:60px;padding-top:18px;border-top:2px solid var(--ink);font-size:12.5px;color:var(--faint)}
.top{display:inline-block;margin-top:10px;font-family:'Spline Sans Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--green);text-decoration:none}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
</style>
</head>

{id:"bourbon-butter",cat:"Sauces & Salsas",title:"Bourbon-Shallot Seafood Butter",base:12,unitword:"coins",meta:"One ~250 g log · chargrilled oysters & lobster · pairs with a pour of bourbon",gf:true,
 ing:[[250,"g",'unsalted butter, softened'],[3,"tbsp",'bourbon'],[1,"",'shallot, minced fine'],[2,"",'garlic cloves, minced'],[1,"tsp",'maple syrup'],[1,"",'lemon — zest + 1 tsp juice'],[1,"tsp",'gluten-free Worcestershire'],[0.5,"tsp",'smoked paprika'],[0.25,"tsp",'cayenne'],[2,"tbsp",'chives, minced'],[1,"tbsp",'flat-leaf parsley, minced'],[0.75,"tsp",'kosher salt'],[0.25,"tsp",'black pepper']],
 steps:["Sweat shallot and garlic in 1 tbsp of the butter, 2–3 min, no browning. Add bourbon and maple; reduce to a syrupy tablespoon.","Cool the reduction completely — warm splits the log.","Beat remaining butter until creamy; add reduction and everything else. Taste salt against how briny your oysters run.","Roll into a 4 cm log in parchment; chill 2+ hours."],

/* ---------- fraction-aware formatting ---------- */
const FR=[[0,""],[.125,"⅛"],[.25,"¼"],[.33,"⅓"],[.375,"⅜"],[.5,"½"],[.625,"⅝"],[.66,"⅔"],[.75,"¾"],[.875,"⅞"],[1,""]];
function fmt(amount,unit){
  if(amount===0)return "—";
  if(unit==="g"||unit==="ml"){
    let v=amount; let r=v>=200?Math.round(v/5)*5:Math.round(v);
    return r+" "+unit;
  }
  // fractions for cups/tbsp/tsp/lb/counts
  let whole=Math.floor(amount),frac=amount-whole;
  let best=FR[0],err=9;
  for(const f of FR){const e=Math.abs(frac-f[0]);if(e<err){err=e;best=f;}}
  if(best[0]===1){whole+=1;best=FR[0];}
  let s=(whole>0?whole:"")+(whole>0&&best[1]?" ":"")+best[1];
  if(!s)s=frac>0? "pinch":"0";
  return s+(unit?" "+unit:"");
}

/* ---------- render ---------- */
const cats=[...new Set(DATA.map(r=>r.cat))];
const toc=document.getElementById("toc");
cats.forEach(c=>{
  const d=document.createElement("div");d.className="toc-cat";
  d.innerHTML="<h2>"+c+"</h2>"+DATA.filter(r=>r.cat===c).map(r=>`<a href="#${r.id}">${r.title}</a>`).join("");
  toc.appendChild(d);
});

const main=document.getElementById("recipes");
const state={};
DATA.forEach(r=>{
  state[r.id]=r.base;
  const a=document.createElement("article");a.className="recipe";a.id=r.id;
  let scaler="";
  if(!r.noscale){
    scaler=`<div class="scaler">
      <span class="lab">Scale</span>
      <button aria-label="Fewer ${r.unitword}" onclick="adj('${r.id}',-1)">−</button>
      <span class="val" id="v-${r.id}">${r.base}</span>
      <button aria-label="More ${r.unitword}" onclick="adj('${r.id}',1)">+</button>
      <span class="unitword">${r.unitword}</span>
      <button class="reset" onclick="rst('${r.id}')">base ${r.base}</button>
    </div>`;
  }
  const prompt=encodeURIComponent(`Pull up the "${r.title}" recipe from my recipe master file (The Sharp Edge) and help me tweak it.`);
  a.innerHTML=`
    <div class="r-cat">${r.cat}</div>
    <h2 class="r-title">${r.title}${r.gf?'<span class="gf-tag">GF</span>':''}</h2>
    <p class="r-meta">${r.meta}</p>
    ${scaler}
    ${r.ing.length?'<h3 class="sect">Ingredients</h3><ul class="ing" id="i-'+r.id+'"></ul>':''}
    <h3 class="sect">${r.ing.length?'Method':'The list'}</h3>
    <ol class="steps">${r.steps.map(s=>"<li>"+s+"</li>").join("")}</ol>
    ${r.notes.length?'<h3 class="sect">Notes</h3><ul class="notes">'+r.notes.map(n=>"<li>"+n+"</li>").join("")+"</ul>":""}
    <div class="askrow"><a class="ask" href="https://claude.ai/new?q=${prompt}">Ask Claude about this recipe →</a></div>`;
  main.appendChild(a);
  paint(r.id);
});

function paint(id){
  const r=DATA.find(x=>x.id===id);if(!r.ing.length)return;
  const k=state[id]/r.base;
  const ul=document.getElementById("i-"+id);
  ul.innerHTML=r.ing.map(([a,u,n])=>`<li><span class="qty">${fmt(a*k,u)}</span><span>${n}</span></li>`).join("");
}
function adj(id,d){
  const r=DATA.find(x=>x.id===id);
  state[id]=Math.min(r.base*4,Math.max(1,state[id]+d));
  document.getElementById("v-"+id).textContent=state[id];
  paint(id);flash(id);
}
function rst(id){
  const r=DATA.find(x=>x.id===id);state[id]=r.base;
  document.getElementById("v-"+id).textContent=r.base;paint(id);flash(id);
}
function flash(id){
  document.querySelectorAll("#i-"+id+" .qty").forEach(q=>{q.classList.add("flash");setTimeout(()=>q.classList.remove("flash"),450);});
}
</script>
